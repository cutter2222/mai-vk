# Русские основы слов → иконка Lucide. Иконка подбирается по первому слову заголовка
# карточки или пункта, у которого нашлась основа; при нескольких совпадениях побеждает
# самая длинная основа («безопасн» раньше «без»). Имена иконок сверяются с набором при
# загрузке: неизвестная иконка просто не участвует.

