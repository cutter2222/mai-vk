# Состав библиотеки собственных композиций: какие семейства включены и с какими параметрами.
# Геометрию строит код (library/geometry.py) — здесь только состав, чтобы добавить или убрать
# варианты без правки кода. Выключенное семейство не попадает в пул кандидатов вовсе.
# Семейство, не упомянутое здесь, считается включённым со своими умолчаниями.
families:
  # --- текст и структура ---
  statement:      { enabled: true }                      # одна мысль крупно
  bullets_pane:   { enabled: true, params: { cols: [1, 2] } }
  cards_grid:     { enabled: true, params: { cols: [2, 3], rows: [1, 2], numbered: [false, true] } }
  icon_cards:     { enabled: true, params: { count: [3, 4] } }
  comparison:     { enabled: true }                      # две стороны
  matrix:         { enabled: true }                      # квадранты 2 × 2
  process:        { enabled: true, params: { count: [3, 4, 5] } }
  diagram_pane:   { enabled: true, params: { lead: [false, true] } }

  # --- числа и данные ---
  kpi_row:        { enabled: true, params: { count: [2, 3, 4], card: [false, true] } }
  hero_number:    { enabled: true }                      # одно число во весь слайд
  chart_takeaway: { enabled: true, params: { side: [left, right] } }
  chart_kpi:      { enabled: true, params: { count: [2, 3] } }
  dashboard:      { enabled: true, params: { count: [2, 3] } }
  table_sheet:    { enabled: true, params: { lead: [false, true] } }

  # --- изображения ---
  image_split:    { enabled: true, params: { side: [left, right], bullets: [false, true] } }
  image_full:     { enabled: true, params: { caption: [false, true] } }
  gallery:        { enabled: true, params: { count: [2, 3, 4] } }
  quote:          { enabled: true, params: { photo: [false, true] } }

  # --- служебные слайды ---
  title_slide:    { enabled: true }
  agenda:         { enabled: true, params: { cols: [1, 2] } }
  section:        { enabled: true, params: { numbered: [false, true] } }
  closing:        { enabled: true }
