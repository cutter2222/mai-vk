[project]
name = "presentation-designer"
version = "0.1.0"
description = "Цифровой дизайнер презентаций: генерация презентаций по шаблону с аудитом качества"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-pptx>=1.0",
    "lxml>=5.3",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "fonttools>=4.54",
    "openai>=1.50",
    "rq>=2.0",
    "redis>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.scripts]
presentation-designer = "presentation_designer.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "datamodel-code-generator[http]>=0.26",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "types-pyyaml",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_designer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "contracts"]
extend-exclude = ["src/presentation_designer/contracts/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["presentation_designer"]
exclude = ["src/presentation_designer/contracts/models\\.py$"]

[[tool.mypy.overrides]]
module = "presentation_designer.contracts.models"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pptx.*", "pdfplumber.*", "pypdfium2.*", "docx.*", "openpyxl.*", "markdown_it.*", "fontTools.*", "rq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "organizer_data: тесты на закрытых шаблонах организаторов; пропускаются без data/organizers, обязательны при REQUIRE_ORGANIZER_DATA=1",
]
