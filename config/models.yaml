# Роли моделей и провайдеры. Секреты только в окружении: имена переменных указаны в env_*.
# Допуск по ТЗ: открытые веса, лицензия Apache 2.0 или MIT, до 35B (text-to-image до 20B).
# Значения model для VK — ориентир из ТЗ (Qwen 3.8 27B). Точный model ID, endpoint и
# возможности фиксируются после зонда (python -m presentation_designer.llm.probe, обёртка
# scripts/probe_llm.py) в docs/llm-capabilities.md; конфиг не выдаёт ориентир за проверенный API.
# Поля verified заполняются только по результату зонда: кто проверил, дата, источник.

providers:
  qwen-api:
    kind: openai_compatible
    env_base_url: PD_QWEN_BASE_URL
    env_api_key: PD_QWEN_API_KEY
    # Адрес шлюза берётся из окружения, и у команды их два с одной и той же моделью:
    #  - api-ai.mai.ru — прокси LiteLLM над vLLM, стоит на сервере (зонды 16.09 и 18.09.2026,
    #    docs/llm-capabilities.md). Рассуждение выключает только
    #    chat_template_kwargs.enable_thinking — стиль vllm_chat_template; reasoning_effort и
    #    enable_thinking в теле принимаются, но не действуют. У шлюза кэш по тексту запроса и
    #    температуре: повтор возвращает прежний ответ независимо от extra_body.
    #  - api.openlux.ai — шлюз с каталогом моделей, используется для локальной разработки без
    #    доступа к mai.ru (зонд 19.09.2026). Рассуждение там не выключается ничем: все три
    #    проверки param_* провалены, chat_template_kwargs принимается и не действует, то есть
    #    стиль vllm_chat_template ему не мешает. Рассуждение приходит отдельным полем reasoning,
    #    но тратит тот же max_completion_tokens: на брифе около 1700 токенов, на плане —
    #    несколько тысяч. При тесных лимитах (500 на бриф, 3500 на план) ответ приходил пустым
    #    с finish=length и этап падал по deadline — это 19.09.2026 выглядело как
    #    непригодность модели. Кэша по тексту запроса у шлюза нет.
    # Поэтому стиль — vllm_chat_template (на mai.ru выключает рассуждение, на openlux
    # безвреден), а бюджеты скиллов подняты с запасом на рассуждение: там, где оно выключено,
    # лишний лимит ничего не стоит.
    reasoning_style: vllm_chat_template
    model_revision: null   # ревизия весов шлюзами не раскрывается
    supports:              # зонды 16–19.09.2026 на обоих шлюзах
      json_schema: true    # строгая схема: полный валидный JSON, finish=stop
      json_object: true
      images: true
      multi_image: true
      usage: true          # prompt/completion есть; reasoning_tokens не отдаётся
    limits:                # документированные квоты провайдером не сообщены: лимитер работает по
      concurrency: null    # умолчаниям llm.* из app.yaml; зонд при одновременности 4 ошибок 429 не получил
      rpm: null
      tpm: null
  gigaam-local:
    # Веса у самого сервиса: распознавание речи для голосового ввода в чате (сервис asr).
    # Экспорт в ONNX и квантование int8 — scripts/export_gigaam_onnx.py, на сервер — make asr-model.
    kind: local_onnx
    runtime: onnxruntime
    quantization: int8
    model_dir: models/gigaam/v3_e2e_ctc
    note: "Модель в сервисе asr: грузится по первой фразе, выгружается после 10 минут простоя; только русский язык, фразы до 25 с."
  vk-inference:
    kind: openai_compatible
    env_base_url: PD_VK_BASE_URL
    env_api_key: PD_VK_API_KEY
    note: "Обязателен для команд топ-10. Доступ и model ID подтверждаются организаторами."
    reasoning_style: none
    model_revision: null
    supports: { json_schema: null, json_object: null, images: null, multi_image: null, usage: null }
    limits: { concurrency: null, rpm: null, tpm: null }

  openrouter:
    # Запасной шлюз для локальной проверки, когда у qwen-api кончилась квота: та же модель
    # qwen/qwen3.8-27b (бесплатная линия :free). Включается из .env без правки этого файла:
    # PD_MODELS__ROLES__LLM__PROVIDER=openrouter, PD_MODELS__ROLES__LLM__MODEL=qwen/qwen3.8-27b:free
    # (и то же для VLM). Бесплатная линия ограничена: около 20 запросов в минуту и перегружена
    # у поставщика (25.09.2026 прошёл 1 запрос из 6); платная qwen/qwen3.8-27b лимитов в минуту
    # не показывает, поэтому ограничена только одновременность.
    kind: openai_compatible
    env_base_url: PD_OPENROUTER_BASE_URL
    env_api_key: PD_OPENROUTER_API_KEY
    reasoning_style: openrouter_reasoning
    model_revision: null
    supports: { json_schema: true, json_object: true, images: true, multi_image: true, usage: true }
    limits: { concurrency: 8, rpm: null, tpm: null }

  claude-bridge:
    # Только для разработки: быстрые прогоны вёрстки на слабой модели Claude (Haiku) через
    # CLI Claude Code на машине разработчика (scripts/claude_bridge.py). В решение не входит —
    # не открытые веса; итоговая проверка качества — на qwen. Включается из .env:
    # PD_MODELS__ROLES__LLM__PROVIDER=claude-bridge, PD_MODELS__ROLES__LLM__MODEL=claude-haiku-4-5.
    kind: openai_compatible
    env_base_url: PD_CLAUDE_BRIDGE_URL
    env_api_key: PD_CLAUDE_BRIDGE_KEY
    reasoning_style: none
    model_revision: null
    supports: { json_schema: true, json_object: true, images: true, multi_image: true, usage: true }
    limits: { concurrency: 8, rpm: null, tpm: null }

active_provider: qwen-api

roles:
  llm:
    provider: qwen-api
    # Модель из ТЗ: её же предоставляют командам топ-10 через инференс VK, поэтому на
    # отборе разумно работать на ней. 27B укладывается в лимит 35B, Apache-2.0, читает
    # изображения. Рассуждение не выключается — оно оплачивается бюджетом токенов ниже.
    model: qwen3.8-27b
    hf_url: https://huggingface.co/Qwen/Qwen3.8-27B
    license: Apache-2.0
    params_b: 27
    # Лимит покрывает рассуждение и ответ: сам ответ плана — до ~2000 токенов, рассуждение
    # добавляет несколько тысяч. Скиллы задают свои лимиты, этот — умолчание роли.
    reasoning: { mode: "off", max_output_tokens: 12000 }
    temperature: 0.2
    verified: { by: probe, date: "2026-09-20", source: "runs/llm-capabilities.md; строгая json_schema и бриф на бюджете 9000 токенов" }
  vlm:
    provider: qwen-api
    model: qwen3.8-27b   # тот же checkpoint, изображения принимает (зонд 19.09.2026)
    hf_url: https://huggingface.co/Qwen/Qwen3.8-27B
    license: Apache-2.0
    params_b: 27
    reasoning: { mode: "off", max_output_tokens: 6000 }
    temperature: 0.0
    verified: { by: probe, date: "2026-09-20", source: "runs/llm-capabilities.md; одно и два изображения прочитаны" }
  asr:
    # Голосовой ввод в чате: GigaAM-v3 (Сбер), линия e2e_ctc — единственная со знаками
    # препинания и нормализацией текста. Контрольные фразы int8 и fp32 совпадают (manifest.json
    # экспорта). Только русский язык.
    provider: gigaam-local
    model: gigaam-v3-e2e-ctc
    hf_url: https://huggingface.co/ai-sage/GigaAM-v3/tree/e2e_ctc
    license: MIT
    params_b: 0.22
    requirements: "ONNX int8 — 320 МБ на диске; процесс с загруженной моделью около 0,5 ГБ (предел контейнера 768 МБ), одно ядро CPU; видеокарта не нужна"
    verified: { by: smoke, date: "2026-09-24", source: "izbox.ru: POST /api/speech/transcribe, запись-пример 11,3 с → текст со знаками препинания за 1,6 с, фраза 5 с — 0,5 с; контейнер 497 МБ из 768" }
  text_to_image:
    enabled: false           # задача со звёздочкой, только топ-10 (этап 13)
    provider: null
    model: null
    hf_url: null
    license: null
    params_b: null
    verified: { by: null, date: null, source: null }
