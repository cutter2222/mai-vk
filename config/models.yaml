# Роли моделей и провайдеры. Секреты только в окружении: имена переменных указаны в env_*.
# Допуск по ТЗ: открытые веса, лицензия Apache 2.0 или MIT, до 35B (text-to-image до 20B).
# Значения model для VK — ориентир из ТЗ (Qwen 3.8 27B). Точный model ID, endpoint и
# возможности фиксируются после зонда (python -m presentation_designer.llm.probe, обёртка
# scripts/probe_llm.py) в docs/llm-capabilities.md; конфиг не выдаёт ориентир за проверенный API.
# Поля verified заполняются только по результату зонда: кто проверил, дата, источник.

providers:
  qwen-api:
    kind: openai_compatible
    env_base_url: PD_QWEN_BASE_URL
    env_api_key: PD_QWEN_API_KEY
    # Провайдер сменён 19.09.2026 на api.openlux.ai (шлюз с каталогом из 419 моделей);
    # прежний api-ai.mai.ru и его замеры описаны в истории docs/llm-capabilities.md.
    # Зонд 19.09.2026: рассуждение на этом шлюзе не выключается ничем — reasoning_effort,
    # enable_thinking и chat_template_kwargs.enable_thinking приняты, но не действуют
    # (все три проверки param_* провалены). Рассуждение приходит отдельным полем reasoning,
    # но тратит тот же max_completion_tokens, поэтому лимит должен покрывать и его: на брифе
    # рассуждение занимает около 1700 токенов, на плане — несколько тысяч. При тесных лимитах
    # (500 на бриф, 3500 на план) ответ приходил пустым с finish=length и этап падал по
    # deadline — это 19.09.2026 и выглядело как непригодность модели. Лимиты скиллов подняты
    # с запасом, стиль рассуждения — none, потому что выключить его нечем.
    # Кэша по тексту запроса у шлюза нет: повтор считается заново (provider_cache: нет).
    reasoning_style: none
    model_revision: null   # ревизия весов шлюзом не раскрывается
    supports:              # зонд 19.09.2026 на qwen3-vl-32b-instruct
      json_schema: true    # строгая схема: ответ за 47 токенов, finish=stop, рассуждения нет
      json_object: true
      images: true
      multi_image: true
      usage: true          # prompt/completion есть; reasoning_tokens не отдаётся
    limits:                # документированные квоты провайдером не сообщены: лимитер работает по
      concurrency: null    # умолчаниям llm.* из app.yaml; зонд при одновременности 4 ошибок 429 не получил
      rpm: null
      tpm: null
  vk-inference:
    kind: openai_compatible
    env_base_url: PD_VK_BASE_URL
    env_api_key: PD_VK_API_KEY
    note: "Обязателен для команд топ-10. Доступ и model ID подтверждаются организаторами."
    reasoning_style: none
    model_revision: null
    supports: { json_schema: null, json_object: null, images: null, multi_image: null, usage: null }
    limits: { concurrency: null, rpm: null, tpm: null }

active_provider: qwen-api

roles:
  llm:
    provider: qwen-api
    # Модель из ТЗ: её же предоставляют командам топ-10 через инференс VK, поэтому на
    # отборе разумно работать на ней. 27B укладывается в лимит 35B, Apache-2.0, читает
    # изображения. Рассуждение не выключается — оно оплачивается бюджетом токенов ниже.
    model: qwen3.8-27b
    hf_url: https://huggingface.co/Qwen/Qwen3.8-27B
    license: Apache-2.0
    params_b: 27
    # Лимит покрывает рассуждение и ответ: сам ответ плана — до ~2000 токенов, рассуждение
    # добавляет несколько тысяч. Скиллы задают свои лимиты, этот — умолчание роли.
    reasoning: { mode: "off", max_output_tokens: 12000 }
    temperature: 0.2
    verified: { by: probe, date: "2026-09-20", source: "runs/llm-capabilities.md; строгая json_schema и бриф на бюджете 9000 токенов" }
  vlm:
    provider: qwen-api
    model: qwen3.8-27b   # тот же checkpoint, изображения принимает (зонд 19.09.2026)
    hf_url: https://huggingface.co/Qwen/Qwen3-VL-32B-Instruct
    license: Apache-2.0
    params_b: 27
    reasoning: { mode: "off", max_output_tokens: 6000 }
    temperature: 0.0
    verified: { by: probe, date: "2026-09-20", source: "runs/llm-capabilities.md; одно и два изображения прочитаны" }
  text_to_image:
    enabled: false           # задача со звёздочкой, только топ-10 (этап 13)
    provider: null
    model: null
    hf_url: null
    license: null
    params_b: null
    verified: { by: null, date: null, source: null }
