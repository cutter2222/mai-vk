# Настройки приложения. Переопределяются переменными окружения с префиксом PD_,
# например PD_LIMITS__MAX_UPLOAD_MB=200. Загрузчик: presentation_designer.shared.settings.
app:
  name: presentation-designer
  contracts_version: "1.9"
  language_default: ru

paths:
  data_dir: data            # загрузки, состояние, кэш
  artifacts_dir: artifacts  # результаты заданий по ревизиям
  runs_dir: runs            # трассы и отчёты прогонов
  backups_dir: backups      # резервные копии (deploy/backup.sh)
  organizers_dir: data/organizers

limits:
  max_upload_mb: 100        # шаблоны датасета 13–23 МБ, шаблон ЛЦТ 34 МБ
  max_unzipped_mb: 1024     # предел распакованного объёма pptx/docx/xlsx при проверке загрузки
  max_content_files: 20
  max_project_files: 50     # квота файлов одного проекта
  max_project_mb: 1024      # суммарный объём файлов одного проекта
  slide_count_default: { min: 10, max: 15 }
  slide_count_max: 60
  variants_default: [compact, balanced, detailed]

# Модель ТЗ (Qwen 3.8 27B) рассуждает перед ответом, и выключить это нечем: один вызов
# смыслового плана занимает около 90 с против 20 с у инструктивной версии. Тайм-ауты учитывают
# рассуждение и повтор после негодного ответа; при их прежних значениях этап падал с
# deadline_exceeded, хотя модель отвечала правильно.
timeouts:
  job_total_s: 900          # общий deadline пользовательского запроса
  stage_analyze_s: 240
  stage_story_s: 300
  stage_plan_s: 300
  stage_compose_s: 180      # вёрстка ~1 с; остальное — правка по фактам: три сборки и до двух вызовов модели
  stage_export_s: 120
  stage_audit_s: 180
  render_convert_s: 90      # одна конвертация ONLYOFFICE
  llm_call_s: 180
  brief_s: 30               # извлечение брифа из сообщения чата: с рассуждением ~17 с, при ошибке эвристика

budget:
  target_total_s: 240       # FRAMEWORKS.md §15: цель, не измеренный результат
  hard_limit_s: 300         # лимит ТЗ на колоду

queue:
  analysis_queue: analysis
  repair_queue: repair
  generation_queue: generation
  interactive_queue: interactive  # фон открытой презентации: воркеры генерации берут её первой
  generation_workers: 3
  result_ttl_s: 86400
  failure_ttl_s: 604800
  heartbeat_ttl_s: 90       # воркер обновляет отметку в Valkey чаще этого срока
  reconcile_interval_s: 60  # сверка заданий без живого исполнителя

execution:
  mode: real                # stub | real: real включает реализованные слои (этап 5: parsing.template),
                            # остальные остаются заглушками с отметкой stub (режим mixed)
  stub_stage_delay_ms: 400  # заглушки имитируют работу этапа, чтобы прогресс был виден

content_import:             # импорт содержания (parsing/content)
  cache_dir: data/import-cache  # разбор каждого файла по sha256, версии парсера и параметрам; бриф в ключ не входит
  max_block_chars: 2000     # длиннее абзацы делятся на несколько блоков
  max_dataset_rows: 200     # строк набора данных в пакете; остальное — total_rows и truncated
  max_facts: 300            # кандидатов фактов на пакет
  max_assets: 40            # изображений на пакет
  min_image_px: 64          # меньшие картинки (разделители, маркеры) в ресурсы не попадают
  fact_context_model: true  # неоднозначный контекст фактов уточняет модель (скилл content_importer)
  fact_context_budget_s: 60 # бюджет всех запросов модели внутри импорта: пачки идут параллельно; на шлюзе
                            # с неотключаемым рассуждением одна пачка из 8 фактов отвечает за 30–60 с
  chart_image_model: true   # только явно подписанные значения; исходная картинка сохраняется
  chart_image_budget_s: 45  # общий бюджет VLM-извлечения графиков
  chart_image_max_images: 8 # уникальных растров за импорт; остальные остаются картинками

research:                   # материалы из интернета, когда кроме темы ничего не дали (parsing/content/research)
  enabled: true             # false — тема без материалов идёт концепцией, как раньше
  max_pages: 6              # страниц в пакете (первая — статья Википедии, если нашлась)
  paragraphs_per_page: 4    # абзацев по теме с одной страницы
  max_chars: 7000           # всего знаков из интернета: выдержка для модели не резиновая
  search_timeout_s: 8       # запрос к поиску
  page_timeout_s: 7         # загрузка одной страницы
  budget_s: 25              # весь поиск: не уложились — берём, что успели
  wikipedia: true           # статья Википедии по словам темы

plan:                       # планы трёх вариантов (generation/variants)
  cache_dir: data/plan-cache  # готовые SlidePlan по ключу: StoryPlan, профиль и шрифты, настройки, версии скилла
  packet_theses: 5          # тезисов в одном запросе модели; пакеты варианта идут параллельно под лимитером
  candidates_per_thesis: 3  # сколько композиций предлагать модели на тезис
  max_candidates: 16        # предел списка композиций в запросе
  min_font_ratio: 0.75      # лестница ёмкости: кегль уменьшается не более чем до этой доли исходного
  min_body_pt: 12           # и не ниже этих кеглей по роли текста
  min_title_pt: 20
  table_max_rows: 7         # строк таблицы на слайде; большие наборы данных планировщик делит между слайдами
  margin_ratio: 0.92        # запас измерения текста, как в анализе шаблона
  style_policy: per_variant # стиль титула, разделителей и финала (style_key паттерна): per_variant —
                            # единый внутри колоды, у compact/balanced/detailed разные; first — первый пул роли
  photo_dividers_for_image_sections: true  # разделитель с фотослотом для раздела с изображением (с этапа 16)

layout:                     # вёрстка PPTX (layout/compose)
  prune_unused_layouts: false  # удалять макеты, которые не использует ни один слайд результата:
                            # файл меньше, но набор макетов в PowerPoint у пользователя меняется
  chart_images:             # «Открыть как презентацию»: диаграммы-картинки → нативные диаграммы
    enabled: true
    budget_s: 150           # секунд на чтение всех картинок одной презентации (модель vlm)
    max_images: 40          # не больше запросов к модели на презентацию
    composites: true        # диаграммы из фигур слайда (столбцы-картинки, кольца с числом) → нативные, без модели

render:
  slots: 2                  # общий лимит запросов конвертации к ONLYOFFICE
  thumbnail_width_px: 1280
  vlm_image_max_px: 1024
  mode: onlyoffice

retention:                  # сборка мусора: периодическая задача воркера анализа (pipeline/gc.py)
  gc_interval_s: 3600       # как часто API ставит задачу сборки мусора в очередь analysis
  upload_tmp_hours: 6       # обрывки незавершённых загрузок в data/uploads/tmp
  unreferenced_uploads_hours: 24  # файлы без ссылок из проектов, шаблонов и пакетов
  orphan_jobs_hours: 24     # задания, пакеты и их артефакты без ссылок из проектов
                            # (срок считается с момента, когда сборка мусора впервые нашла сироту)

backup:
  keep: 7                   # сколько последних резервных копий хранить в backups/

audit:
  contextual_enabled: true
  contextual_concurrency: 4
  thresholds:
    max_bullets: 6
    max_words_per_bullet: 15
    table_max_rows: 7
    table_max_cols: 5
    chart_max_series: 5
    fill_ratio_min: 0.25
    fill_ratio_max: 0.75
    min_contrast: 4.5
    overlap_min_ratio: 0.02
    guide_tolerance: 0.005

llm:
  cache_mode: read_write    # эксплуатационный кэш: off | read | read_write; тестовые записи: record | replay
  cache_dir: data/llm-cache # ключ = содержимое запроса и картинок, провайдер, модель и ревизия, версия промпта
                            # и схемы, параметры; в резервную копию не входит, сборка мусора его не трогает
  fixtures_dir: tests/fixtures/llm  # записи для replay в тестах; закрытые материалы сюда не попадают
  concurrency: 8            # замер 20.09.2026 на api.openlux.ai: 4 одновременных запроса дают
                            # 8,8 ответов в минуту, 8 — 14,3 без единого отказа, 16 шлюз не
                            # держит (12 таймаутов из 16). Документированных квот провайдер
                            # не сообщает, поэтому значение измеренное, а не заявленное.
  rpm: 60
  tpm: 200000
  max_retries: 3            # свои повторы (429, сеть, 5xx, негодный ответ); повторы SDK выключены
  retry_base_s: 1.0
  retry_max_s: 30.0
  lease_ttl_s: 180          # аренда лимитера истекает сама, если воркер упал (>= llm_call_s + запас)
  quota_wait_max_s: 120     # предел ожидания квоты одним запросом; deadline этапа может быть короче
  chars_per_token: 3.0      # консервативная оценка токенов текста для резервирования до ответа
  image_tokens: 1280        # оценка токенов одного изображения (миниатюра до 1024 px)

# Слой design: приведение композиции к объёму содержания (см.
# src/presentation_designer/design/README.md). Пороги заполненности свои у
# каждого варианта вёрстки — ТЗ п.2.5; рамки взяты из раздела «Плотность»
# Приложения 1, где дефектом считается заполненность меньше четверти.
design:
  # Правка плана по фактам собранного файла: черновая сборка → факты → правка →
  # сборка начисто. Сборка колоды стоит около секунды, поэтому проход
  # укладывается в лимит ТЗ; выключается здесь же, без правки кода.
  feedback:
    enabled: true
    refill: true          # дозапрос к модели на слоты, пустые в файле
    rounds: 2             # кругов дозапроса: дальше выигрыш не окупает вызова
    max_slots: 24
    # Замена композиции по фактам. В первой попытке её пришлось выключить:
    # слайд с одним показателем уходил из фирменной инфографики в одинокий
    # прямоугольник. Сейчас замену страхуют два правила, которых тогда не
    # было: ряд одинаковых мест заполняется целиком или снимается, а вся
    # правка принимается только при падении счёта на пересобранной колоде.
    # 24.09.2026 выключена снова: подбор по объёму делает планировщик (fit_draft с
    # кандидатами по фактическому объёму), а поздний перенос блоков по видам слотов
    # клал пункты в заголовки карточек, и дозапрос дописывал в опустевший текст обрывки
    # «Гео», «Ванд». Счёт дефектов такую подмену не видит.
    pattern_swap: false
  variants:
    compact:  { min_fill: 0.25, max_fill: 0.65, max_slots_ratio: 1.6 }
    balanced: { min_fill: 0.35, max_fill: 0.72, max_slots_ratio: 1.5 }
    detailed: { min_fill: 0.45, max_fill: 0.75, max_slots_ratio: 1.4 }

speech:                     # голосовой ввод в чате: сервис asr (GigaAM, ONNX Runtime), docs/speech.md
  enabled: true
  url: http://asr:8010      # API пересылает фразы сюда; PD_SPEECH__URL переопределяет
  timeout_s: 20
  max_seconds: 25           # модель без нарезки принимает до 25 с; фразы режет браузер
  max_bytes: 1000000        # 25 с PCM16 моно 16 кГц — 800 КБ
  health_cache_s: 30
  model_dir: models/gigaam/v3_e2e_ctc   # в контейнере /app/models/…, на сервер — make asr-model
  idle_unload_s: 600        # модель выгружается после 10 минут простоя
  threads: 1
  port: 8010
