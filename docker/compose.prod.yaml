# Прод-надстройка над docker/compose.yaml для сервера. Не заменяет базовый файл, а дополняет:
#   docker compose -f docker/compose.yaml -f docker/compose.prod.yaml --env-file $SERVER_DIR/.env up -d
# ONLYOFFICE обслуживает редактор и конвертации. Старые замеры headless-рендера
# не применимы: размер сервера и лимиты проверяются нагрузочным тестом нового стека.
# Пределы контейнеров — потолок, а не резерв: сумма пределов больше памяти сервера сознательно.
# Логи — json-file с ротацией; Valkey — без вытеснения ключей (очередь не должна терять задания).

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-prod-env: &prod-env
  # Один рычаг в .env сервера для слотов рендера и числа воркеров: приложение видит те же
  # значения, что и compose (реплики), — их показывает /api/health и учитывает экспорт.
  PD_RENDER__SLOTS: ${PD_RENDER_SLOTS:-2}
  PD_QUEUE__GENERATION_WORKERS: ${PD_GENERATION_WORKERS:-3}

x-worker-prod: &worker-prod
  logging: *logging
  # Воркеру дают завершить текущий этап: отмена RQ останавливает задачу на границе этапа.
  stop_grace_period: 60s
  environment: *prod-env
  deploy:
    resources:
      limits:
        memory: ${PD_WORKER_MEMORY:-1536M}
        cpus: "1.5"

services:
  caddy:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"

  frontend:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  api:
    logging: *logging
    environment: *prod-env
    deploy:
      resources:
        limits:
          memory: ${PD_API_MEMORY:-512M}
          cpus: "1.0"

  worker-analysis:
    <<: *worker-prod

  worker-generation:
    <<: *worker-prod

  # Модель GigaAM int8 — 320 МБ; с загруженной моделью процесс держится в пределах 768 МБ.
  asr:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${PD_ASR_MEMORY:-768M}
          cpus: "1.0"

  onlyoffice:
    logging: *logging
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: ${PD_ONLYOFFICE_MEMORY:-4G}
          cpus: "2.0"

  valkey:
    logging: *logging
    # AOF раз в секунду плюс снимок; при переполнении памяти запись отклоняется, а не теряется.
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60 1"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
