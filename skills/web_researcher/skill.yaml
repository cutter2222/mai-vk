# Манифест скилла по contracts/schemas/skill_manifest.schema.json
schema_version: '1.1'
name: web_researcher
version: 0.1.0
stage: import
description: 'Поисковые запросы по теме презентации, когда кроме темы материалов нет: три-четыре
  разных запроса (факты, исследования, цифры, примеры) и название статьи Википедии. Страницы
  ищет и читает код (parsing/content/research), модель только формулирует запросы'
model_role: llm
response_format: json_schema
reasoning:
  mode: 'off'
  max_output_tokens: 800
prompts:
- id: research.queries
  path: prompts/research.queries.v0.1.0.md
  version: 0.1.0
params:
  temperature: 0.0
  deadline_s: 15         # не уложилась — запросы строятся из темы без модели
changelog:
- version: 0.1.0
  date: '2026-09-25'
  note: 'запросы для поиска материалов по теме без файлов: разные стороны темы вместо одного
    пересказа названия, статья Википедии по предмету, а не по слову «исследование»'
