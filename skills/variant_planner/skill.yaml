# Манифест скилла по contracts/schemas/skill_manifest.schema.json
schema_version: '1.1'
name: variant_planner
version: 0.1.0
stage: plan
description: Строит SlidePlan одного варианта из StoryPlan и кандидатов-паттернов
  с ёмкостью слотов
model_role: llm
response_format: json_schema
reasoning:
  mode: low
  max_output_tokens: 4000
prompts:
- id: plan.slides
  path: prompts/plan.slides.v0.1.0.md
  version: 0.1.0
params:
  temperature: 0.2
input_schema: story_plan
output_schema: slide_plan
changelog:
- version: 0.1.0
  date: '2026-09-15'
  note: 'каркас: манифест и заглушка промпта; содержание промпта пишется на этапе
    реализации слоя'
