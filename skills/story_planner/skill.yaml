# Манифест скилла по contracts/schemas/skill_manifest.schema.json
schema_version: '1.1'
name: story_planner
version: 0.1.0
stage: story
description: 'Строит общий смысловой план StoryPlan из ContentPackage: тезисы, выводы,
  обязательность, ссылки на факты'
model_role: llm
response_format: json_schema
reasoning:
  mode: low
  max_output_tokens: 4000
prompts:
- id: story.outline
  path: prompts/story.outline.v0.1.0.md
  version: 0.1.0
params:
  temperature: 0.2
input_schema: content_package
output_schema: story_plan
changelog:
- version: 0.1.0
  date: '2026-09-15'
  note: 'каркас: манифест и заглушка промпта; содержание промпта пишется на этапе
    реализации слоя'
